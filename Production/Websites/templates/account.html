{% extends 'base.html' %}{% block body %}<section class="section narrow"><p class="eyebrow">YOUR MEMBERSHIP</p><h1>ACCOUNT.</h1><p>{{g.user.email}}</p>{% if error %}<p class="error">{{error}}</p>{% endif %}{% if message %}<p class="notice">{{message}}</p>{% endif %}<form method="post" class="panel"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Current password<input type="password" name="current" required autocomplete="current-password"></label><label>New password<input type="password" name="new" minlength="12" maxlength="128" autocomplete="new-password"></label><button class="button" name="action" value="password">Change password</button>{% if not g.user.staff %}<hr><p>Delete your membership and sign out permanently.</p><button class="quiet danger" name="action" value="delete">Delete my account</button>{% endif %}</form></section>{% endblock %}
